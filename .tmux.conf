# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'MunifTanjim/tmux-suspend'

set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'whame/tmux-modal'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'roosta/tmux-pop'
set -g @plugin 'daplay/tmux_nvr'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'graemedavidson/tmux-pane-focus'
set -g @plugin 'samleeney/tmux-agent-status'

set -g history-limit 100000

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1  ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1  ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# tmux-pop
set -g @tmux-pop-color 'blue'
run ~/.tmux/plugins/tmux-pop/tmux_pop.tmux

# tmux-active-pane-background
tmux_conf_theme_highlight_focused_pane=true

set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# tmux-continuum
set -g @continuum-restore 'on'

# tmux-suspend
set -g @suspend_key 'C-b'
# remove colors from status line for suspended state
set -g @suspend_suspended_options " \
  status-left-style::bg=brightblack\\,fg=black bold dim, \
  window-status-current-style:gw:bg=brightblack\\,fg=black, \
  window-status-last-style:gw:fg=brightblack, \
  window-status-style:gw:bg=black\\,fg=brightblack, \
  @mode_indicator_custom_prompt:: ---- , \
  @mode_indicator_custom_mode_style::bg=brightblack\\,fg=black, \
"

# tmux cpu mem
set -g status-interval 2

# tmux visual key
setw -g mode-keys vi

# tmux-mouse
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# tmux kanagawa
run ~/.tmux/plugins/kanagawa-tmux/kanagawa.tmux
set -g @kanagawa_window_tabs_enabled on
set -g @kanagawa_left_separator "█"
set -g @kanagawa_right_separator "█"
set -g @kanagawa_date_time "%Y-%m-%d %H:%M"
set -g @kanagawa_user "on"
set -g @kanagawa_host "on"

# finger
set -g @fingers-key f

# for italics
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g @pane-focus-enabled off
set -g @pane-focus-size '60'
set -g @pane-focus-direction '|'

# Agent status
set -g @agent-status-key "S"
set -g @agent-sidebar-key "o"
set -g @agent-next-done-key "N"
set -g @agent-wait-key "W"
set -g @agent-park-key "p"

set -g @agent-switcher-style "both"        # popup | sidebar | both
set -g @agent-status-display-method "popup" # popup | window
set -g @agent-sidebar-width "60"

# Switcher view (prefix + S). "tree" is the hierarchical
# session/window/pane list (default). "agents" is a flat list of every
# agent pane sorted by status. Toggle mid-session with ctrl-f.
set -g @agent-switcher-default-mode "tree"  # tree | agents

# Keep the agent sidebar open whenever a new pane is split into a window.
set-hook -g after-split-window 'run-shell -b "~/.tmux/ensure-agent-sidebar.sh"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

