# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'MunifTanjim/tmux-suspend'

set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'whame/tmux-modal'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'daplay/tmux_nvr'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'graemedavidson/tmux-pane-focus'
set -g @plugin 'roosta/tmux-pop'
set -g @plugin 'accessd/tmux-agent-indicator'

set -g history-limit 100000

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1  ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1  ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# pane select overlay: prefix+j/k instead of default prefix+q
unbind-key q
bind-key j display-panes
bind-key k display-panes
set -g display-panes-time 20000

# prefix+w: session picker
bind-key w choose-session -Z

# disable prefix+space (default: next-layout)
unbind-key Space

# always show pane number on each pane's border
set -g base-index 1
set -g pane-base-index 1
set -g pane-border-status top
set -g pane-border-format '#P #{pane_current_command}'

# tmux-pop
set -g @tmux-pop-color '#dddcd6'
run ~/.tmux/plugins/tmux-pop/tmux_pop.tmux

# tmux-active-pane-background
tmux_conf_theme_highlight_focused_pane=true

set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# tmux-continuum
set -g @continuum-restore 'on'

# tmux-suspend
set -g @suspend_key 'C-b'
# remove colors from status line for suspended state
set -g @suspend_suspended_options " \
  status-left-style::bg=brightblack\\,fg=black bold dim, \
  window-status-current-style:gw:bg=brightblack\\,fg=black, \
  window-status-last-style:gw:fg=brightblack, \
  window-status-style:gw:bg=black\\,fg=brightblack, \
  @mode_indicator_custom_prompt:: ---- , \
  @mode_indicator_custom_mode_style::bg=brightblack\\,fg=black, \
"

# tmux cpu mem
set -g status-interval 2

# tmux visual key
setw -g mode-keys vi

# tmux-mouse
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# token-light theme
source ~/.tmux/themes/token-light/token-light.conf

# allow OSC passthrough so apps (e.g. Copilot CLI) can query the terminal's
# actual background color for light/dark auto-detection
set -g allow-passthrough on

# finger
set -g @fingers-key f

# for italics
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g @pane-focus-enabled off
set -g @pane-focus-size '60'
set -g @pane-focus-direction '+'

# tmux-agent-indicator: pane/window highlighting + status icon for AI coding
# agents. Claude and Codex get native hooks via the plugin's own installer
# (~/.tmux/plugins/tmux-agent-indicator/install.sh); Copilot CLI has no
# native support so install.sh in this repo wires a custom hook file into
# ~/.copilot/hooks/.
# Enable/disable visual channels
set -g @agent-indicator-background-enabled 'on'
set -g @agent-indicator-border-enabled 'off'
set -g @agent-indicator-indicator-enabled 'on'

# Keep pane colors until you focus the pane (instead of clearing immediately)
set -g @agent-indicator-reset-on-focus 'on'

# Knight Rider animation while running
set -g @agent-indicator-animation-enabled 'on'

set -g @agent-indicator-icons 'claude=🤖,codex=🧠,opencode=💻,copilot=🐙,default=🤖'
set -g @agent-indicator-processes 'claude,codex,aider,cursor,opencode,copilot'

# Upstream "Preset 1 (Balanced)" colors, swapped for token-light's own
# palette (wezterm.lua) instead of raw 256-color codes: bright yellow for
# needs-input, bright green for done — each bg is a pale tint of its own
# border color, not theme grey.
set -g @agent-indicator-running-enabled 'on'
set -g @agent-indicator-running-bg ''
set -g @agent-indicator-running-border ''

set -g @agent-indicator-needs-input-enabled 'on'
set -g @agent-indicator-needs-input-bg '#e8dcbe'
set -g @agent-indicator-needs-input-border '#876032'

set -g @agent-indicator-done-enabled 'on'
set -g @agent-indicator-done-bg '#d3e0c9'
set -g @agent-indicator-done-border '#3a5e37'
set -g @agent-indicator-done-window-title-bg '#3a5e37'
set -g @agent-indicator-done-window-title-fg '#2a2920'

set -g @agent-indicator-session-dots-active '🌕'
set -g @agent-indicator-session-dots-inactive '🌑'
set -g @agent-indicator-session-dots-attention '🤖'
# Which agent states trigger attention highlighting (comma-separated)
set -g @agent-indicator-session-dots-attention-states 'needs-input,done'

set -g status-right '#{agent_session_dots} #{agent_indicator} | %H:%M %d-%b-%y'

set -g extended-keys on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

